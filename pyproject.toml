[build-system]
requires = ["setuptools>=83,<84", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
# OWNER DECISION REQUIRED BEFORE ANY RELEASE.
# The PyPI name `agentcheck` is already registered to an unrelated project
# ("Trace . Replay . Test your AI agents like real software", 0.1.0, uploaded
# 2025-07-01). This name therefore cannot be uploaded as-is. The import package
# and the CLI can still be `agentcheck` whatever is decided; only the
# distribution name is contested. Nothing here is published, so this stays as a
# statement of intent until the owner picks a path.
name = "agentcheck"
# This version is not only release metadata. It is recorded as
# `provenance.generator_version` inside every frozen suite, and the suite
# fingerprint is a hash of that document. Bumping it re-identifies every
# existing suite, baseline, and replay manifest, so treat it as a contract
# change rather than a routine version bump.
version = "0.1.0"
description = "Deterministic, local behavioral and safety evaluation for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Waseem Ghanem" }]
requires-python = ">=3.10"
keywords = ["ai-agents", "evaluation", "testing", "safety", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "jsonschema>=4.23,<5",
    "pydantic>=2.12.5,<3.0",
    "referencing>=0.36,<1",
    "requests>=2.33.1,<3.0",
    "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
# Each adapter reads framework-private attributes to build an AgentSpec, so an
# unverified version could produce a wrong spec rather than an obvious error.
# Both gates are pinned to a single verified minor for that reason. They are
# separate extras so evaluating one framework never installs the other.
openai-agents = [
    "openai-agents>=0.20,<0.21",
    "websockets>=15,<16",
]
pydantic-ai = [
    "pydantic-ai-slim>=2.32,<2.33",
]
all = [
    "agentcheck[openai-agents]",
    "agentcheck[pydantic-ai]",
]
dev = [
    "agentcheck[all]",
    "build>=1.3,<2",
    # Ruff's and mypy's default rule sets move between minors, so an unpinned
    # range means a lint failure lands on whoever installs next rather than on
    # the change that caused it. These are the versions the tree is actually
    # clean against; widening the range is a deliberate act with a diff attached.
    "mypy>=1.17,<1.18",
    "pytest>=8.0,<10.0",
    "pytest-xdist>=3.6,<4",
    # scripts/check_workflow_safety.py parses the workflows it audits.
    "pyyaml>=6.0,<7",
    "ruff>=0.12,<0.13",
    "types-requests>=2.32,<3",
]

[project.scripts]
agentcheck = "agentcheck.cli:main"

[project.urls]
Homepage = "https://github.com/WaseemGhanem98/AgentCheck"
Documentation = "https://github.com/WaseemGhanem98/AgentCheck#readme"
Issues = "https://github.com/WaseemGhanem98/AgentCheck/issues"
Source = "https://github.com/WaseemGhanem98/AgentCheck"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentcheck", "agentcheck.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
