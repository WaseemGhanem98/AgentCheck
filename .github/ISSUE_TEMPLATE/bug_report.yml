name: Bug report
description: Something AgentCheck did that it should not have, or did not do that it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, provider payloads, customer data, or unreviewed
        `.agentcheck/` artifacts. For a security vulnerability, do not open an
        Issue; use the private reporting path in SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Integration
      options:
        - OpenAI Agents SDK
        - PydanticAI
        - Custom Python agent
        - Not integration-specific
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include `agentcheck --version`, Python, and the framework SDK version when applicable.
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Verdict involved
      description: INFRA_ERROR is a harness or setup error, not behavioral FAIL.
      options:
        - PASS
        - FAIL
        - INCONCLUSIVE
        - INFRA_ERROR
        - No verdict / command failed
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command and a minimal synthetic target or fixture when possible.
    validations:
      required: true
