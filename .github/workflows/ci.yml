# Public CI executes repository code only on ephemeral GitHub-hosted runners.
# Fork pull requests use the `pull_request` event with a read-only token, no
# secrets, and no privileged environment. `pull_request_target` is forbidden.
#
# Every job must use an ephemeral GitHub-hosted runner. See
# docs/ci-trust-model.md and the static safety check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PRIMARY_PYTHON: "3.12"

jobs:
  scope:
    name: Classify change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      expensive: ${{ steps.classify.outputs.expensive }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify documentation-only changes
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Fail closed: missing/unresolvable event SHAs keep the full matrix on.
          expensive=true
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
              && git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            expensive=false
            while IFS= read -r -d '' path; do
              case "$path" in
                *.md|docs/assets/*|NOTICE) ;;
                *) expensive=true; break ;;
              esac
            done < <(
              git diff --no-renames --name-only -z \
                "$BASE_SHA" "$HEAD_SHA"
            )
          fi
          echo "expensive=$expensive" >> "$GITHUB_OUTPUT"
          echo "full validation required: $expensive"

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    needs: scope
    if: needs.scope.outputs.expensive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Pull requests cover every supported interpreter. A push to main reruns
        # the full suite on the primary interpreter to catch merge races.
        python-version: ${{ github.event_name == 'push' && fromJSON('["3.12"]') || fromJSON('["3.10", "3.11", "3.12"]') }}

    env:
      AGENTCHECK_ALLOWED_TEST: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.18"
          enable-cache: false

      - name: Verify no provider credential reached this job
        run: |
          for name in OPENAI_API_KEY ANTHROPIC_API_KEY GOOGLE_API_KEY; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "$name is present in this job's environment; the suite expects it absent" >&2
              exit 1
            fi
          done
          echo "PASS: no provider credential is visible to this job"

      - name: Create an isolated virtual environment
        run: |
          uv venv --python "${{ matrix.python-version }}" \
            --python-preference only-managed "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Verify interpreter integrity
        run: python scripts/check_interpreter_integrity.py "${{ matrix.python-version }}"

      - name: Install
        run: uv pip install --python "$RUNNER_TEMP/venv/bin/python" -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q agentcheck scripts examples tests

      - name: Test
        # The primary interpreter runs everything; the others run the
        # compatibility manifest. AgentCheck scenarios already run in child
        # processes, so serialize these process-heavy pytest invocations on
        # standard hosted runners. Product wall-clock budgets stay unchanged.
        run: |
          if [ "${{ matrix.python-version }}" = "$PRIMARY_PYTHON" ]; then
            python -m pytest -p no:cacheprovider tests -q -n 1
          else
            mapfile -t compat < <(python tests/compat_manifest.py)
            echo "cross-version suite: ${#compat[@]} files"
            python -m pytest -p no:cacheprovider "${compat[@]}" -q -n 1
          fi

  checks:
    name: Quality, packaging, extras, and workflow trust
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AGENTCHECK_ALLOWED_TEST: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.18"
          enable-cache: false

      - name: Verify no provider credential reached this job
        run: |
          for name in OPENAI_API_KEY ANTHROPIC_API_KEY GOOGLE_API_KEY; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "$name is present in this job's environment" >&2
              exit 1
            fi
          done
          echo "PASS: no provider credential is visible to this job"

      - name: Create isolated virtual environment
        run: |
          uv venv --python 3.12 --python-preference only-managed "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Create package-validation virtual environments
        if: needs.scope.outputs.expensive == 'true'
        run: |
          uv venv --python 3.12 --python-preference only-managed "$RUNNER_TEMP/base-venv"
          uv venv --python 3.12 --python-preference only-managed "$RUNNER_TEMP/openai-venv"
          uv venv --python 3.12 --python-preference only-managed "$RUNNER_TEMP/pydantic-venv"
          uv venv --python 3.12 --python-preference only-managed "$RUNNER_TEMP/wheel-venv"

      - name: Verify interpreter integrity
        run: python scripts/check_interpreter_integrity.py "3.12"

      - name: Install
        run: uv pip install --python "$RUNNER_TEMP/venv/bin/python" -e ".[dev]"

      - name: Verify workflow trust model
        if: ${{ !cancelled() }}
        run: python scripts/check_workflow_safety.py

      - name: Ruff
        if: ${{ !cancelled() && needs.scope.outputs.expensive == 'true' }}
        run: python -m ruff check agentcheck tests scripts

      - name: Mypy
        if: ${{ !cancelled() && needs.scope.outputs.expensive == 'true' }}
        run: python -m mypy agentcheck

      - name: Secret scan
        if: ${{ !cancelled() }}
        run: python scripts/check_no_secrets.py

      - name: Documentation consistency
        if: ${{ !cancelled() && needs.scope.outputs.expensive == 'false' }}
        run: |
          python -m pytest -p no:cacheprovider -q -n 2 \
            tests/agentcheck/test_cli_diagnostics.py::test_public_safety_docs_keep_the_declared_tool_boundary_narrow \
            tests/agentcheck/test_cli_diagnostics.py::test_allowed_public_alpha_polish_does_not_drift \
            tests/agentcheck/test_example_custom_agent.py::test_cli_skeleton_documentation_and_example_keep_one_contract \
            tests/agentcheck/test_example_custom_agent.py::test_docs_quote_the_controlled_model_refusal_and_observability_boundary \
            tests/agentcheck/test_example_pydantic_agent.py::test_example_contract_fixtures_and_docs_are_one_onboarding_path \
            tests/agentcheck/test_example_pydantic_agent.py::test_pydantic_guide_explains_controlled_model_limits_and_fail_closed_setup

      - name: Base install has no framework
        if: ${{ !cancelled() && needs.scope.outputs.expensive == 'true' }}
        run: |
          uv pip install --python "$RUNNER_TEMP/base-venv/bin/python" .
          "$RUNNER_TEMP/base-venv/bin/python" - <<'PY'
          import importlib.util
          for framework in ("agents", "pydantic_ai"):
              assert importlib.util.find_spec(framework) is None, (
                  f"{framework} must not be a base dependency"
              )
          import agentcheck
          print("base import ok:", agentcheck.__version__)
          PY
          "$RUNNER_TEMP/base-venv/bin/agentcheck" --help > /dev/null

      - name: A missing extra is actionable, not a traceback
        if: ${{ !cancelled() && needs.scope.outputs.expensive == 'true' }}
        run: |
          "$RUNNER_TEMP/base-venv/bin/python" - <<'PY'
          from agentcheck.adapters import AdapterDependencyError
          from agentcheck.adapters.openai_agents import _require_sdk as need_openai
          from agentcheck.adapters.pydantic_ai import _require_sdk as need_pydantic

          for require in (need_openai, need_pydantic):
              try:
                  require()
              except AdapterDependencyError as exc:
                  assert "pip install" in str(exc), exc
                  print("ok:", exc)
              else:
                  raise AssertionError(f"{require} should have refused")
          PY

      - name: Extra openai-agents in isolation
        if: ${{ !cancelled() && needs.scope.outputs.expensive == 'true' }}
        run: |
          uv pip install --python "$RUNNER_TEMP/openai-venv/bin/python" ".[openai-agents]" pytest
          "$RUNNER_TEMP/openai-venv/bin/python" -c "
          import importlib.util
          assert importlib.util.find_spec('agents') is not None
          assert importlib.util.find_spec('pydantic_ai') is None, 'pydantic-ai leaked'
          "
          "$RUNNER_TEMP/openai-venv/bin/python" -m pytest tests/agentcheck/test_openai_adapter.py -q

      - name: Extra pydantic-ai in isolation
        if: ${{ !cancelled() && needs.scope.outputs.expensive == 'true' }}
        run: |
          uv pip install --python "$RUNNER_TEMP/pydantic-venv/bin/python" ".[pydantic-ai]" pytest
          "$RUNNER_TEMP/pydantic-venv/bin/python" -c "
          import importlib.util
          assert importlib.util.find_spec('pydantic_ai') is not None
          assert importlib.util.find_spec('agents') is None, 'openai-agents leaked'
          "
          "$RUNNER_TEMP/pydantic-venv/bin/python" -m pytest tests/agentcheck/test_pydantic_ai_adapter.py -q

      - name: Build wheel and sdist
        if: ${{ !cancelled() && needs.scope.outputs.expensive == 'true' }}
        run: python -m build --outdir "$RUNNER_TEMP/dist"

      - name: Audit artifact contents
        if: ${{ !cancelled() && needs.scope.outputs.expensive == 'true' }}
        run: |
          rm -rf dist && cp -r "$RUNNER_TEMP/dist" dist
          python scripts/check_distribution.py

      - name: Wheel install smoke test
        if: ${{ !cancelled() && needs.scope.outputs.expensive == 'true' }}
        run: |
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" -c "import agentcheck; print(agentcheck.__version__)"
          "$RUNNER_TEMP/wheel-venv/bin/agentcheck" --help > /dev/null
          echo "wheel install smoke passed"

  required:
    # The single status branch protection should require. The matrix cannot play
    # that role: it is skipped by design on documentation-only pull requests, and
    # a skipped job never reports, so requiring it by name leaves those pull
    # requests waiting forever for a status that will never arrive.
    #
    # always() is what makes this report at all when an upstream job is skipped.
    # It deliberately does not mean "pass anyway": the script refuses a skipped
    # matrix on a code change, refuses a failed or cancelled matrix in any scope,
    # and treats an unreadable classification as a code change.
    name: Required CI
    needs: [scope, tests, checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve required job results
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          EXPENSIVE: ${{ needs.scope.outputs.expensive }}
        # Standard library only, so the gate does not depend on an install
        # succeeding in order to report that something failed.
        run: python3 scripts/check_required_ci.py
