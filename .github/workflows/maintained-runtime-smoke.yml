# Review-only candidate for one harmless maintained-runtime dependency smoke.
# Do not push or invoke before fresh independent review of the exact tree.

name: Maintained runtime harmless smoke

on:
  workflow_dispatch:

permissions: {}

jobs:
  harmless-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOCKER_KEY_URL: https://download.docker.com/linux/ubuntu/gpg
      DOCKER_KEY_SHA256: 1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570
      DOCKER_KEY_PRIMARY_FINGERPRINT: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
      DOCKER_KEY_SIGNING_FINGERPRINT: D3306A018370199E527AE7997EA0A9C3F273FCD8
      DOCKER_INRELEASE_URL: https://download.docker.com/linux/ubuntu/dists/noble/InRelease
      DOCKER_RELEASE_SUITE: noble
      DOCKER_RELEASE_ARCHITECTURE: amd64
      DOCKER_PACKAGES_PATH: stable/binary-amd64/Packages.gz
      DOCKER_PACKAGES_URL: https://download.docker.com/linux/ubuntu/dists/noble/stable/binary-amd64/Packages.gz
      DOCKER_PACKAGES_SHA256: a22aaf0fdf661041647ae600107851fc8c4e5c5bb507013d03a4220d09884aed
      DOCKER_PACKAGES_SIZE: "77410"
      DOCKER_CE_VERSION: 5:29.7.2-1~ubuntu.24.04~noble
      DOCKER_CE_URL: https://download.docker.com/linux/ubuntu/dists/noble/pool/stable/amd64/docker-ce_29.7.2-1~ubuntu.24.04~noble_amd64.deb
      DOCKER_CE_SHA256: 8243f97d569a0fa33ea32417e399e9f524e7d75d3898fa9d24e0eadaa486af68
      DOCKER_CE_SIZE: "24039440"
      DOCKER_CLI_VERSION: 5:29.7.2-1~ubuntu.24.04~noble
      DOCKER_CLI_URL: https://download.docker.com/linux/ubuntu/dists/noble/pool/stable/amd64/docker-ce-cli_29.7.2-1~ubuntu.24.04~noble_amd64.deb
      DOCKER_CLI_SHA256: 920a5fa031f33f2dd5b56b4a9bc4c725bc9549d6007004a6610a469873ec69fe
      DOCKER_CLI_SIZE: "16984968"
      CONTAINERD_VERSION: 2.1.5-1~ubuntu.24.04~noble
      CONTAINERD_URL: https://download.docker.com/linux/ubuntu/dists/noble/pool/stable/amd64/containerd.io_2.1.5-1~ubuntu.24.04~noble_amd64.deb
      CONTAINERD_SHA256: 42abab84165c35f6db6a141a02546d2396d8b9ef2c1923e2d6e4ec46cc5c6d47
      CONTAINERD_SIZE: "22421448"
      REQUIRED_DOCKER_VERSION: 29.7.2
      GVISOR_RELEASE: release-20260817.0
      GVISOR_COMMIT: 50e1502a95d36ad2faf2c7ef33b8bf21fe975293
      GVISOR_ARCHIVE_URL: https://storage.googleapis.com/gvisor/releases/release/20260817.0/x86_64/gvisor.tar.bz2
      GVISOR_ARCHIVE_SIZE: "164966070"
      GVISOR_ARCHIVE_SHA256: ae345a8c1466586b3a163fb534301913da663a97b8ed446bc711b2e1963a32c5
      GVISOR_ARCHIVE_SHA512: bd8271a7742f90e53373b2a8613f37f3ae2c765ff5e2e611a75a47167a323cab7519b149c50273307743491713525a14ad1b3e398651c93b16f3e248dfeff3dd
      GVISOR_CHECKSUM_URL: https://storage.googleapis.com/gvisor/releases/release/20260817.0/x86_64/gvisor.tar.bz2.sha512
      GVISOR_CHECKSUM_SHA256: 05730cd00318dff9e618e33566d6fa246cbd3ac141bb5799355ca039ff0556ee
      RUNTIME_NAME: ac-smoke-runsc
      OCI_IMAGE: docker.io/library/python@sha256:4427763a1ba36f5aa8f656a03e5d00f3b8d61f5dd950c73df6c14f8c7640f8ab
      OCI_MANIFEST_DIGEST: sha256:4427763a1ba36f5aa8f656a03e5d00f3b8d61f5dd950c73df6c14f8c7640f8ab
      OCI_CONFIG_DIGEST: sha256:4a7066d275a270e82ae35c51c7beed7167a9e23713d8b95ea5a5dc5c229d60aa
      CONTAINER_USER: "65532:65532"
      CONTAINER_TMPFS: /tmp:rw,nosuid,nodev,noexec,size=16m,uid=65532,gid=65532,mode=0700

    steps:
      - name: Verify, run, and tear down the frozen harmless smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          WORK_DIR="$(mktemp -d "$RUNNER_TEMP/ac-maintained-runtime-smoke.XXXXXX")"
          EVIDENCE="$WORK_DIR/evidence.tsv"
          SENTINEL="$RUNNER_TEMP/ac-host-sentinel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CONTAINER_NAME="ac-harmless-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DOCKER_DAEMON_CONFIG=/etc/docker/daemon.json
          DOCKER_DAEMON_BACKUP=/etc/docker/daemon.json~
          runtime_registered=0
          gvisor_installed=0
          image_pulled=0
          container_owned=0
          sentinel_owned=0
          sentinel_before=missing
          daemon_state_captured=0
          daemon_config_before_state=not-captured
          daemon_backup_before_state=not-captured

          emit() {
            local key="$1"
            local value="$2"
            if [[ "$key" == *$'\t'* || "$value" == *$'\t'* || "$value" == *$'\n'* ]]; then
              echo "invalid multiline evidence value for $key" >&2
              return 1
            fi
            if [[ -d "$WORK_DIR" ]]; then
              printf 'AC_SMOKE_EVIDENCE_V1\t%s\t%s\n' "$key" "$value" \
                | tee -a "$EVIDENCE"
            else
              printf 'AC_SMOKE_EVIDENCE_V1\t%s\t%s\n' "$key" "$value"
            fi
          }

          fail() {
            echo "FAIL: $*" >&2
            return 1
          }

          fetch() {
            local url="$1"
            local output="$2"
            curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
              --output "$output" "$url"
          }

          require_sha256() {
            local expected="$1"
            local path="$2"
            local evidence_key="$3"
            local actual
            actual="$(sha256sum "$path" | awk '{print $1}')"
            emit "${evidence_key}_sha256_expected" "$expected"
            emit "${evidence_key}_sha256_actual" "$actual"
            [[ "$actual" == "$expected" ]] || fail "SHA-256 mismatch for $path"
          }

          require_sha512() {
            local expected="$1"
            local path="$2"
            local evidence_key="$3"
            local actual
            actual="$(sha512sum "$path" | awk '{print $1}')"
            emit "${evidence_key}_sha512_expected" "$expected"
            emit "${evidence_key}_sha512_actual" "$actual"
            [[ "$actual" == "$expected" ]] || fail "SHA-512 mismatch for $path"
          }

          require_size() {
            local expected="$1"
            local path="$2"
            local evidence_key="$3"
            local actual
            actual="$(stat --format=%s "$path")"
            emit "${evidence_key}_size_expected" "$expected"
            emit "${evidence_key}_size_actual" "$actual"
            [[ "$actual" == "$expected" ]] || fail "size mismatch for $path"
          }

          verify_deb() {
            local path="$1"
            local expected_sha256="$2"
            local expected_size="$3"
            local expected_package="$4"
            local expected_version="$5"
            local evidence_key="$6"
            local actual_package actual_version actual_architecture

            require_sha256 "$expected_sha256" "$path" "$evidence_key"
            require_size "$expected_size" "$path" "$evidence_key"
            actual_package="$(dpkg-deb --field "$path" Package)"
            actual_version="$(dpkg-deb --field "$path" Version)"
            actual_architecture="$(dpkg-deb --field "$path" Architecture)"
            emit "${evidence_key}_control_package_expected" "$expected_package"
            emit "${evidence_key}_control_package_actual" "$actual_package"
            emit "${evidence_key}_control_version_expected" "$expected_version"
            emit "${evidence_key}_control_version_actual" "$actual_version"
            emit "${evidence_key}_control_architecture_expected" amd64
            emit "${evidence_key}_control_architecture_actual" "$actual_architecture"
            [[ "$actual_package" == "$expected_package" ]] \
              || fail "package control name mismatch for $path"
            [[ "$actual_version" == "$expected_version" ]] \
              || fail "package control version mismatch for $path"
            [[ "$actual_architecture" == "amd64" ]] \
              || fail "package control architecture mismatch for $path"
          }

          verify_docker_repository_metadata() {
            local docker_key="$1"
            local docker_inrelease="$2"
            local docker_packages="$3"
            local release_values release_suite release_architectures
            local signed_sha256 signed_size signed_path actual_architecture

            require_sha256 "$DOCKER_KEY_SHA256" "$docker_key" docker_key
            mapfile -t docker_fingerprints < <(
              gpg --batch --show-keys --with-colons "$docker_key" \
                | awk -F: '$1 == "fpr" {print $10}'
            )
            [[ "${#docker_fingerprints[@]}" == "2" ]] \
              || fail "unexpected Docker key fingerprint count"
            emit docker_key_primary_fingerprint_expected "$DOCKER_KEY_PRIMARY_FINGERPRINT"
            emit docker_key_primary_fingerprint_actual "${docker_fingerprints[0]}"
            emit docker_key_signing_fingerprint_expected "$DOCKER_KEY_SIGNING_FINGERPRINT"
            emit docker_key_signing_fingerprint_actual "${docker_fingerprints[1]}"
            [[ "${docker_fingerprints[0]}" == "$DOCKER_KEY_PRIMARY_FINGERPRINT" ]] \
              || fail "Docker primary key fingerprint mismatch"
            [[ "${docker_fingerprints[1]}" == "$DOCKER_KEY_SIGNING_FINGERPRINT" ]] \
              || fail "Docker signing subkey fingerprint mismatch"
            gpg --batch --yes --dearmor --output "$WORK_DIR/docker.gpg" "$docker_key"
            gpgv --keyring "$WORK_DIR/docker.gpg" "$docker_inrelease"
            emit docker_inrelease_signature verified
            emit docker_inrelease_sha256_actual \
              "$(sha256sum "$docker_inrelease" | awk '{print $1}')"
            emit docker_inrelease_size_actual "$(stat --format=%s "$docker_inrelease")"

            # Parse the clear-signed payload only after gpgv succeeds. Aggregate
            # Release fields may move; the exact suite, target architecture,
            # path, signed SHA-256, and signed size relationship may not.
            release_values="$(python3 - "$docker_inrelease" "$DOCKER_PACKAGES_PATH" <<'PY'
          import pathlib
          import re
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          target_path = sys.argv[2]
          try:
              signed = lines.index("-----BEGIN PGP SIGNED MESSAGE-----")
              payload_start = lines.index("", signed + 1) + 1
              signature_start = lines.index("-----BEGIN PGP SIGNATURE-----", payload_start)
          except ValueError as exc:
              raise SystemExit(f"malformed clear-signed InRelease: {exc}") from exc
          payload = [
              line[2:] if line.startswith("- ") else line
              for line in lines[payload_start:signature_start]
          ]

          fields = {}
          for line in payload:
              match = re.fullmatch(r"([A-Za-z][A-Za-z0-9-]*):(?: (.*))?", line)
              if match:
                  fields.setdefault(match.group(1), []).append(match.group(2) or "")
          for required_field in ("Suite", "Architectures"):
              if len(fields.get(required_field, [])) != 1:
                  raise SystemExit(
                      f"signed InRelease {required_field} field count: "
                      f"{len(fields.get(required_field, []))}"
                  )
          suite = fields["Suite"][0]
          architectures = fields["Architectures"][0]

          if payload.count("SHA256:") != 1:
              raise SystemExit(
                  f"signed InRelease SHA256 section count: {payload.count('SHA256:')}"
              )
          sha256_start = payload.index("SHA256:") + 1
          matches = []
          for line in payload[sha256_start:]:
              if not line.startswith(" "):
                  break
              match = re.fullmatch(r" ([0-9a-f]{64}) +([0-9]+) (\S+)", line)
              if match and match.group(3) == target_path:
                  matches.append(match.groups())
          if len(matches) != 1:
              raise SystemExit(
                  f"signed SHA256 relationship count for {target_path!r}: {len(matches)}"
              )
          digest, size, path = matches[0]
          print("\t".join((suite, architectures, digest, size, path)))
          PY
            )"
            IFS=$'\t' read -r release_suite release_architectures \
              signed_sha256 signed_size signed_path <<< "$release_values"
            emit docker_release_suite_expected "$DOCKER_RELEASE_SUITE"
            emit docker_release_suite_actual "$release_suite"
            emit docker_release_architecture_expected "$DOCKER_RELEASE_ARCHITECTURE"
            emit docker_release_architectures_actual "$release_architectures"
            emit docker_signed_packages_path_expected "$DOCKER_PACKAGES_PATH"
            emit docker_signed_packages_path_actual "$signed_path"
            emit docker_signed_packages_sha256_expected "$DOCKER_PACKAGES_SHA256"
            emit docker_signed_packages_sha256_actual "$signed_sha256"
            emit docker_signed_packages_size_expected "$DOCKER_PACKAGES_SIZE"
            emit docker_signed_packages_size_actual "$signed_size"
            [[ "$release_suite" == "$DOCKER_RELEASE_SUITE" ]] \
              || fail "Docker signed suite mismatch"
            actual_architecture=missing
            case " $release_architectures " in
              *" $DOCKER_RELEASE_ARCHITECTURE "*) actual_architecture="$DOCKER_RELEASE_ARCHITECTURE" ;;
            esac
            emit docker_release_architecture_actual "$actual_architecture"
            [[ "$actual_architecture" == "$DOCKER_RELEASE_ARCHITECTURE" ]] \
              || fail "Docker signed architecture mismatch"
            [[ "$signed_path" == "$DOCKER_PACKAGES_PATH" ]] \
              || fail "Docker signed package-index path mismatch"
            [[ "$signed_sha256" == "$DOCKER_PACKAGES_SHA256" ]] \
              || fail "Docker signed package-index SHA-256 mismatch"
            [[ "$signed_size" == "$DOCKER_PACKAGES_SIZE" ]] \
              || fail "Docker signed package-index size mismatch"
            require_sha256 \
              "$DOCKER_PACKAGES_SHA256" "$docker_packages" docker_packages_index
            require_size \
              "$DOCKER_PACKAGES_SIZE" "$docker_packages" docker_packages_index
          }

          daemon_path_state() {
            local path="$1"
            local digest metadata
            if ! sudo test -e "$path"; then
              printf '%s\n' absent
              return 0
            fi
            digest="$(sudo sha256sum "$path" | awk '{print $1}')"
            metadata="$(sudo stat --format='%u:%g:%a' "$path")"
            printf 'sha256=%s,uid-gid-mode=%s\n' "$digest" "$metadata"
          }

          restore_daemon_path() {
            local path="$1"
            local snapshot="$2"
            local expected_state="$3"
            if [[ "$expected_state" == "absent" ]]; then
              sudo rm -f -- "$path" || return 1
            else
              sudo rm -f -- "$path" || return 1
              sudo cp --archive --no-dereference "$snapshot" "$path" || return 1
            fi
            [[ "$(daemon_path_state "$path")" == "$expected_state" ]]
          }

          count_gvisor_processes() {
            local count=0
            local link target
            for link in /proc/[0-9]*/exe; do
              if ! target="$(sudo readlink "$link" 2>/dev/null)"; then
                continue
              fi
              case "$target" in
                /usr/local/bin/runsc|/usr/local/bin/containerd-shim-runsc-v1|/usr/local/bin/gvisor-bin/*)
                  count=$((count + 1))
                  ;;
              esac
            done
            printf '%s\n' "$count"
          }

          runtime_map_absent() {
            local runtime_map="$1"
            python3 -c \
              'import json, os, sys; raise SystemExit(os.environ["RUNTIME_NAME"] in json.load(sys.stdin))' \
              <<< "$runtime_map"
          }

          wait_for_runtime_absence() {
            local max_attempts="$1"
            local delay_seconds="$2"
            local attempt observed_map
            runtime_map_actual=unavailable
            runtime_wait_attempts=0
            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              runtime_wait_attempts="$attempt"
              if observed_map="$(docker info --format '{{json .Runtimes}}' 2>/dev/null)"; then
                runtime_map_actual="$observed_map"
                if runtime_map_absent "$runtime_map_actual"; then
                  return 0
                fi
              else
                runtime_map_actual=unavailable
              fi
              if [[ "$attempt" != "$max_attempts" ]]; then
                sleep "$delay_seconds"
              fi
            done
            return 1
          }

          cleanup_docker_runtime_state() {
            local runtime_was_registered="$1"
            local integration_rc=0
            local reload_exit=not-run
            local restart_exit=not-run
            local restart_used=false
            local after_reload_absent=not-run
            local after_reload_map=not-run
            local after_reload_attempts=0
            local final_map=unavailable
            local final_attempts=0
            local service_state=unavailable
            local service_active=false
            runtime_cleanup_absent=false

            if [[ "$runtime_was_registered" == "1" ]]; then
              if sudo systemctl reload docker.service; then
                reload_exit=0
              else
                reload_exit=$?
                integration_rc=1
              fi
              if wait_for_runtime_absence 5 1; then
                after_reload_absent=true
              else
                after_reload_absent=false
              fi
              after_reload_map="$runtime_map_actual"
              after_reload_attempts="$runtime_wait_attempts"

              if [[ "$reload_exit" != "0" || "$after_reload_absent" != "true" ]]; then
                restart_used=true
                if sudo systemctl restart docker.service; then
                  restart_exit=0
                else
                  restart_exit=$?
                  integration_rc=1
                fi
                if wait_for_runtime_absence 5 1; then
                  runtime_cleanup_absent=true
                fi
                final_map="$runtime_map_actual"
                final_attempts="$runtime_wait_attempts"
              else
                runtime_cleanup_absent=true
                final_map="$after_reload_map"
                final_attempts="$after_reload_attempts"
              fi
            else
              if wait_for_runtime_absence 1 0; then
                runtime_cleanup_absent=true
              fi
              final_map="$runtime_map_actual"
              final_attempts="$runtime_wait_attempts"
            fi

            if service_state="$(systemctl is-active docker.service 2>/dev/null)" \
                && [[ "$service_state" == "active" ]]; then
              service_active=true
            else
              integration_rc=1
              [[ -n "$service_state" ]] || service_state=unavailable
            fi
            [[ "$runtime_cleanup_absent" == "true" ]] || integration_rc=1

            emit cleanup_docker_reload_exit "$reload_exit"
            emit cleanup_runtime_after_reload_expected_absent true
            emit cleanup_runtime_after_reload_absent "$after_reload_absent"
            emit cleanup_runtime_after_reload_map "$after_reload_map"
            emit cleanup_runtime_after_reload_attempts "$after_reload_attempts"
            emit cleanup_docker_restart_used "$restart_used"
            emit cleanup_docker_restart_exit "$restart_exit"
            emit cleanup_runtime_final_expected_absent true
            emit cleanup_runtime_final_absent "$runtime_cleanup_absent"
            emit cleanup_runtime_final_map "$final_map"
            emit cleanup_runtime_final_attempts "$final_attempts"
            emit cleanup_docker_service_state "$service_state"
            emit cleanup_docker_service_active "$service_active"
            [[ "$integration_rc" == "0" ]]
          }

          cleanup() {
            local original_rc=$?
            local cleanup_rc=0
            local remaining=0
            local after_hash="missing"
            local container_absent=false
            local runtime_absent=false
            local image_absent=false
            local gvisor_files_absent=false
            local work_dir_absent=false
            local daemon_config_restored=not-captured
            local daemon_backup_restored=not-captured
            local daemon_config_restore_applied=not-captured
            local daemon_backup_restore_applied=not-captured
            local daemon_config_final_state=not-captured
            local daemon_backup_final_state=not-captured
            local runsc_uninstall_exit=not-run
            trap - EXIT
            set +e

            if [[ "$container_owned" == "1" ]] \
                && docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
              if ! docker container rm --force "$CONTAINER_NAME" >/dev/null; then
                cleanup_rc=1
              fi
            fi
            if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
              cleanup_rc=1
            else
              container_absent=true
            fi

            if [[ "$runtime_registered" == "1" ]]; then
              if sudo /usr/local/bin/runsc uninstall --runtime "$RUNTIME_NAME"; then
                runsc_uninstall_exit=0
              else
                runsc_uninstall_exit=$?
                cleanup_rc=1
              fi
            fi
            if [[ "$daemon_state_captured" == "1" ]]; then
              daemon_config_restore_applied=false
              daemon_backup_restore_applied=false
              if restore_daemon_path \
                  "$DOCKER_DAEMON_CONFIG" \
                  "$WORK_DIR/daemon.json.before" \
                  "$daemon_config_before_state"; then
                daemon_config_restore_applied=true
              else
                cleanup_rc=1
              fi
              if restore_daemon_path \
                  "$DOCKER_DAEMON_BACKUP" \
                  "$WORK_DIR/daemon.json-backup.before" \
                  "$daemon_backup_before_state"; then
                daemon_backup_restore_applied=true
              else
                cleanup_rc=1
              fi
            fi
            if cleanup_docker_runtime_state "$runtime_registered"; then
              runtime_absent="$runtime_cleanup_absent"
            else
              runtime_absent="$runtime_cleanup_absent"
              cleanup_rc=1
            fi
            if [[ "$daemon_state_captured" == "1" ]]; then
              daemon_config_final_state="$(daemon_path_state "$DOCKER_DAEMON_CONFIG")"
              daemon_backup_final_state="$(daemon_path_state "$DOCKER_DAEMON_BACKUP")"
              daemon_config_restored=false
              daemon_backup_restored=false
              if [[ "$daemon_config_restore_applied" == "true" \
                  && "$daemon_config_final_state" == "$daemon_config_before_state" ]]; then
                daemon_config_restored=true
              else
                cleanup_rc=1
              fi
              if [[ "$daemon_backup_restore_applied" == "true" \
                  && "$daemon_backup_final_state" == "$daemon_backup_before_state" ]]; then
                daemon_backup_restored=true
              else
                cleanup_rc=1
              fi
            fi

            for _ in {1..10}; do
              remaining="$(count_gvisor_processes)"
              if [[ "$remaining" == "0" ]]; then
                break
              fi
              sleep 1
            done
            if [[ "$remaining" != "0" ]]; then
              cleanup_rc=1
            fi

            if [[ "$image_pulled" == "1" ]]; then
              if docker image inspect "$OCI_IMAGE" >/dev/null 2>&1; then
                if ! docker image rm "$OCI_IMAGE" >/dev/null; then
                  cleanup_rc=1
                fi
              fi
            fi
            if ! docker image inspect "$OCI_IMAGE" >/dev/null 2>&1; then
              image_absent=true
            fi

            if [[ "$sentinel_owned" == "1" && -f "$SENTINEL" ]]; then
              after_hash="$(sha256sum "$SENTINEL" | awk '{print $1}')"
              if [[ "$after_hash" != "$sentinel_before" ]]; then
                cleanup_rc=1
              fi
              if ! rm -f "$SENTINEL"; then
                cleanup_rc=1
              fi
            elif [[ "$sentinel_owned" == "1" ]]; then
              cleanup_rc=1
            fi

            if [[ "$gvisor_installed" == "1" ]]; then
              if ! sudo rm -f \
                /usr/local/bin/runsc \
                /usr/local/bin/containerd-shim-runsc-v1 \
                /usr/local/bin/gvisor-bin/checkpointgofer \
                /usr/local/bin/gvisor-bin/gvisor-sentry-prewarmer \
                /usr/local/bin/gvisor-bin/gvisor_sentry \
                /usr/local/bin/gvisor-bin/runsc-metric-server; then
                cleanup_rc=1
              fi
              if ! sudo rmdir /usr/local/bin/gvisor-bin; then
                cleanup_rc=1
              fi
            fi
            if [[ ! -e /usr/local/bin/runsc \
                && ! -e /usr/local/bin/containerd-shim-runsc-v1 \
                && ! -e /usr/local/bin/gvisor-bin ]]; then
              gvisor_files_absent=true
            else
              cleanup_rc=1
            fi

            emit cleanup_container_absent "$container_absent"
            emit cleanup_residual_gvisor_processes "$remaining"
            emit cleanup_runsc_uninstall_exit "$runsc_uninstall_exit"
            emit cleanup_runtime_absent "$runtime_absent"
            emit cleanup_daemon_config_restored "$daemon_config_restored"
            emit cleanup_daemon_backup_restored "$daemon_backup_restored"
            emit cleanup_daemon_config_expected_state "$daemon_config_before_state"
            emit cleanup_daemon_config_final_state "$daemon_config_final_state"
