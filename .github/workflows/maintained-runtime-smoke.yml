          container_security_opt="$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$CONTAINER_NAME")"
          container_tmpfs="$(docker inspect --format '{{json .HostConfig.Tmpfs}}' "$CONTAINER_NAME")"
          [[ "$container_user" == "$CONTAINER_USER" ]] \
            || fail "container numeric user mismatch"
          python3 - \
            "$container_cap_drop" \
            "$container_security_opt" \
            "$container_tmpfs" <<'PY'
          import json
          import sys

          cap_drop, security_opt, tmpfs = map(json.loads, sys.argv[1:])
          if cap_drop != ["ALL"]:
              raise SystemExit(f"container CapDrop mismatch: {cap_drop!r}")
          if security_opt != ["no-new-privileges"]:
              raise SystemExit(f"container SecurityOpt mismatch: {security_opt!r}")
          expected_tmpfs = (
              "rw,nosuid,nodev,noexec,size=16m,uid=65532,gid=65532,mode=0700"
          )
          if tmpfs != {"/tmp": expected_tmpfs}:
              raise SystemExit(f"container tmpfs mismatch: {tmpfs!r}")
          PY

          host_pid="$(docker inspect --format '{{.State.Pid}}' "$CONTAINER_NAME")"
          [[ "$host_pid" =~ ^[1-9][0-9]*$ ]] || fail "Docker host PID is invalid"
          host_exe="$(sudo readlink "/proc/$host_pid/exe")"
          case "$host_exe" in
            /usr/local/bin/runsc)
              host_exe_expected_sha512=84936438d583ec976800f464e75a83e1515f0890b451b9b4db219c4472b54ca9b106a6772ee683f1e64cce2128871d7637b14d800591f8451b8137f6c39fb2ef
              ;;
            /usr/local/bin/containerd-shim-runsc-v1)
              host_exe_expected_sha512=b60d1c418b841ab046951cc7a91f490a221198fbe81ec55dc364432578fddd44e97063793ce6651be397af2f64ec47170dff77a45db277819c3fb08fec9f3ced
              ;;
            /usr/local/bin/gvisor-bin/checkpointgofer)
              host_exe_expected_sha512=8aff47fbad7c1ec5e5d156a1bb566e5f5d75db0f9bec5abf7d14bbf74e2a09c60a6692bafd2cefe4c1ed9aa0b46cdc701f09fef34f229ed74c27d068903c79f3
              ;;
            /usr/local/bin/gvisor-bin/gvisor-sentry-prewarmer)
              host_exe_expected_sha512=f0c131766303ca4733a4e42bd171d8ddf42a0a0087564605b3207b0f4c148d9ff355bad25e27d388c7c9cf06265160b3a02047ec195c035d9e8f428d8f608ce6
              ;;
            /usr/local/bin/gvisor-bin/gvisor_sentry)
              host_exe_expected_sha512=09eef70d5d14e42bdc5f9e55ca9710a14e157d67cc1ce92df5f4322df1ba5ee67a598161c4854e206ecbfdff85d69418814bdcd45e4f6273eeaf0196b0d3adb3
              ;;
            /usr/local/bin/gvisor-bin/runsc-metric-server)
              host_exe_expected_sha512=d47c33c105419c5c3c28b8894fad6cb917c3897c5376f3ffb955275af6bf744039f4e9f7bb2a0313d84fb296b643d3d4b66e7a4247e1e5cb568f8b69ac6a29ab
              ;;
            *)
              fail "container host PID does not execute a frozen gVisor binary: $host_exe"
              ;;
          esac
          host_exe_sha512="$(sudo sha512sum "$host_exe" | awk '{print $1}')"
          emit container_host_executable_sha512_expected "$host_exe_expected_sha512"
          emit container_host_executable_sha512_actual "$host_exe_sha512"
          [[ "$host_exe_sha512" == "$host_exe_expected_sha512" ]] \
            || fail "live host-side gVisor executable hash mismatch"
          live_gvisor_processes="$(count_gvisor_processes)"
          [[ "$live_gvisor_processes" =~ ^[1-9][0-9]*$ ]] \
            || fail "missing live host-side gVisor process evidence"

          emit container_id "$container_id"
          emit container_runtime "$RUNTIME_NAME"
          emit container_host_pid "$host_pid"
          emit container_host_executable "$host_exe"
          emit container_host_executable_sha512 "$host_exe_sha512"
          emit live_gvisor_processes "$live_gvisor_processes"
          emit container_bind_mounts none
          emit container_network none
          emit container_root_read_only true
          emit container_privileged false
          emit container_user "$container_user"
          emit container_cap_drop "$container_cap_drop"
          emit container_security_opt "$container_security_opt"
          emit container_tmpfs "$container_tmpfs"
          emit container_stdout "$container_logs"

          container_exit="$(docker wait "$CONTAINER_NAME")"
          [[ "$container_exit" == "0" ]] || fail "benign container exited nonzero"
          emit container_exit "$container_exit"

          for _ in {1..10}; do
            if ! docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            fail "container was not automatically removed"
          fi
          emit container_removed true
          container_owned=0

          remaining_after_container=0
          for _ in {1..10}; do
            remaining_after_container="$(count_gvisor_processes)"
            if [[ "$remaining_after_container" == "0" ]]; then
              break
            fi
            sleep 1
          done
          [[ "$remaining_after_container" == "0" ]] \
            || fail "gVisor process remained after container removal"
          emit post_container_gvisor_processes "$remaining_after_container"

          sentinel_after="$(sha256sum "$SENTINEL" | awk '{print $1}')"
          emit sentinel_after_sha256_expected "$sentinel_before"
          emit sentinel_after_sha256_actual "$sentinel_after"
          [[ "$sentinel_after" == "$sentinel_before" ]] || fail "host sentinel changed"
          emit sentinel_after_sha256 "$sentinel_after"
          emit sentinel_unchanged true
